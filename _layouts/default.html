<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="nav">
        <a href="{{ '/' | relative_url }}#projects">Projects</a>
        <a href="{{ '/' | relative_url }}#about">About</a>
        {% if site.cv_file != "" %}<a href="{{ site.cv_file | relative_url }}">CV</a>{% endif %}
        <a href="mailto:{{ site.email }}">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>&copy; {{ site.time | date: "%Y" }} {{ site.title }}</span>
      <span class="footer-links">
        <a href="mailto:{{ site.email }}">Email</a>
        {% if site.linkedin != "" %}<a href="{{ site.linkedin }}">LinkedIn</a>{% endif %}
        {% if site.github != "" %}<a href="{{ site.github }}">GitHub</a>{% endif %}
      </span>
    </div>
  </footer>
</body>
</html>
